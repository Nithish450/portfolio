<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6" opacity="0.4"/>
  
  <!-- Code brackets -->
  <text x="200" y="125" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="28" font-weight="700" fill="#38bdf8" letter-spacing="4">&lt; / &gt;</text>
  
  <!-- Initials -->
  <text x="200" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="115" font-weight="800" fill="#f8fafc" letter-spacing="-4">
    N<tspan fill="#38bdf8">G</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="4">SOFTWARE DEVELOPER</text>
  
  <!-- Pill badge -->
  <rect x="125" y="305" width="150" height="26" rx="13" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
  <text x="200" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.5">ENTERPRISE WEB</text>
</svg>